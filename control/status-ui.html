<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QQ 控制台 · 状态</title>
<link rel="stylesheet" href="/console.css">
</head>
<body class="qqc">
<div class="qqc-top"><div class="qqc-top-in">
  <span class="qqc-title">QQ 控制台</span>
  <span id="verdict" class="qqc-dot"><i></i><span>读取中…</span></span>
  <span class="qqc-sub" id="stamp"></span>
  <nav>
    <a href="/identity">身份</a>
    <a href="/plugins">插件</a>
    <a href="/system">系统配置</a>
    <a href="/">权限与语料</a>
    <a href="#" onclick="doLogout();return false">退出</a>
    <button class="qqc-btn ghost sm" onclick="refresh(true)">刷新</button>
  </nav>
</div></div>

<div class="qqc-wrap">
  <div class="qqc-tiles" id="tiles"></div>

  <div class="qqc-grid">
    <section class="qqc-card">
      <h2 class="qqc-h">系统</h2>
      <table class="qqc-table" id="system"></table>
      <div class="qqc-sub" id="versions" style="margin-top:10px"></div>
    </section>
    <section class="qqc-card">
      <h2 class="qqc-h">服务可用性</h2>
      <table class="qqc-table" id="ports"></table>
    </section>
  </div>

  <section class="qqc-card">
    <h2 class="qqc-h">服务控制</h2>
    <div class="qqc-sub" style="margin-bottom:10px">危险操作（重启宿主、重启 NapCat）需要输一次登录密码，5 分钟内有效。</div>
    <table class="qqc-table" id="services"></table>
    <div class="qqc-msg" id="svcMsg"></div>
  </section>

  <section class="qqc-card">
    <h2 class="qqc-h">系统参数</h2>
    <div class="qqc-sub" style="margin-bottom:10px">看门狗与代理回落开关，写在 <span class="qqc-v" id="envPath"></span>。保存后自动重启看门狗，不影响 QQ。</div>
    <div id="params"></div>
    <div class="qqc-actions" style="margin:16px 0 0">
      <button class="qqc-btn" onclick="saveSystem()">保存并重启看门狗</button>
      <button class="qqc-btn ghost" onclick="loadSystem()">放弃修改</button>
    </div>
    <div class="qqc-msg" id="sysMsg"></div>
  </section>

  <div class="qqc-grid">
    <section class="qqc-card">
      <h2 class="qqc-h">QQ 桥接</h2>
      <table class="qqc-table" id="bridge"></table>
      <details style="margin-top:12px"><summary class="qqc-sub">最近 trace</summary><div class="qqc-log" id="traces" style="margin-top:8px"></div></details>
    </section>
    <section class="qqc-card">
      <h2 class="qqc-h">代理</h2>
      <table class="qqc-table" id="proxy"></table>
      <details style="margin-top:12px"><summary class="qqc-sub">探活日志</summary><div class="qqc-log" id="proxylog" style="margin-top:8px"></div></details>
    </section>
  </div>

  <div class="qqc-grid">
    <section class="qqc-card">
      <h2 class="qqc-h">扫码登录 QQ</h2>
      <table class="qqc-table" id="napcat"></table>
      <div style="display:flex; gap:16px; align-items:flex-start; margin-top:14px; flex-wrap:wrap">
        <img id="qr" class="qqc-qr" alt="登录二维码" style="display:none">
        <div>
          <div class="qqc-actions" style="margin:0 0 8px">
            <button class="qqc-btn" onclick="loadQr()">刷新二维码</button>
            <button class="qqc-btn ghost" onclick="openWebui()">打开 NapCat WebUI</button>
          </div>
          <div class="qqc-sub" id="qrNote"></div>
        </div>
      </div>
    </section>
    <section class="qqc-card">
      <h2 class="qqc-h">容器</h2>
      <table class="qqc-table" id="docker"></table>
    </section>
  </div>

  <section class="qqc-card">
    <h2 class="qqc-h">日志</h2>
    <div class="qqc-logs">
      <details open><summary>看门狗（最近 25 行）</summary><div class="qqc-log" id="logWatchdog"></div></details>
      <details><summary>重启记录</summary><div class="qqc-log" id="logRestart"></div></details>
      <details open><summary>事故流水</summary><div class="qqc-log" id="logIncidents"></div></details>
    </div>
  </section>
</div>

<script>
const q = (s) => (s || '').replace(/^&/, '');
const el = (id) => document.getElementById(id);
const esc = (v) => String(v ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
function setHtml(id, html) { const n = el(id); if (n && n.innerHTML !== html) n.innerHTML = html; }
function setText(id, text) { const n = el(id); if (n && n.textContent !== text) n.textContent = text; }
function tr(k, v) { return `<tr><td class="qqc-k">${esc(k)}</td><td class="qqc-v">${v}</td></tr>`; }
function dot(state, text, detail = '') {
  return `<span class="qqc-dot ${state}"><i></i><span>${esc(text)}</span></span>${detail ? ` <span class="qqc-sub">${esc(detail)}</span>` : ''}`;
}
function bytes(n) { if (!n && n !== 0) return '?'; const u = ['B','K','M','G','T']; let i = 0; let v = Number(n); while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; } return `${v.toFixed(i ? 1 : 0)}${u[i]}`; }
function dur(s) { if (!s && s !== 0) return '?'; const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60); return d ? `${d}天${h}时` : (h ? `${h}时${m}分` : `${m}分${Math.floor(s % 60)}秒`); }
el('pluginsLink') && (el('pluginsLink').href = '/plugins');

async function doLogout() {
  await fetch('/api/logout', { method: 'POST' });
  location.href = '/login';
}
async function loadQr() {
  try {
    const meta = await fetch(`/api/napcat/qr?${q()}`).then((r) => r.json());
    if (meta.ok) {
      el('qr').src = `/api/napcat/qr.png?${q('&t=' + Date.now())}`;
      el('qr').style.display = 'block';
      el('qrNote').textContent = `二维码 ${meta.ageSeconds}s 前从容器取出（${bytes(meta.bytes)}）` + (meta.ageSeconds > 120 ? '，看起来已过期 —— 点「打开 NapCat WebUI」重新发起登录' : '，扫码后本页会自动刷新');
    } else {
      el('qr').style.display = 'none';
      el('qrNote').textContent = meta.reason || '取不到二维码（可能已登录；要换号就点「打开 NapCat WebUI」）';
    }
  } catch (e) { el('qrNote').textContent = '取二维码失败：' + e.message; }
}
function openWebui() { location.href = `/api/napcat/webui?${q()}`; }

async function refresh() {
  const res = await fetch(`/api/status?${q()}`);
  if (res.status === 401) { location.href = '/login?next=' + encodeURIComponent('/status'); return; }
  const d = await res.json();
  const p = d.ports;
  const healthy = p.dshUsable && p.bridgeUsable && p.napcatUsable && d.docker.ok;
  const v = el('verdict');
  v.className = 'qqc-dot ' + (healthy ? 'ok' : 'bad');
  v.lastElementChild.textContent = healthy ? '全部正常' : '有组件异常';
  el('stamp').textContent = new Date(d.at).toLocaleString('zh-CN');

  const tiles = [
    ['DSH 宿主', p.dshUsable, p.dshUsable ? '可用' : '不可用', `HTTP ${p.dshProbe.code || '-'} · ${p.dshProbe.ms}ms`],
    ['QQ 桥接', p.bridgeUsable, p.bridgeUsable ? '可用' : '不可用', `pid ${d.bridge.pid ?? '-'} · 会话 ${d.bridge.sessionCount ?? '-'}`],
    ['NapCat', p.napcatUsable, p.napcatUsable ? '可用' : '不可用', `HTTP ${p.napcatProbe.code || '-'}`],
    ['代理', d.proxy.healthy !== false, d.proxy.mode === 'proxy' ? '走代理' : '直连', `${d.proxy.code || '-'} · ${d.proxy.proxy || '未配置'}`],
  ];
  if (!el('tiles').dataset.built) {
    el('tiles').innerHTML = tiles.map(([label], i) => `<div class="qqc-tile"><div class="lab">${esc(label)}</div><div class="val"><span id="tile-${i}" class="qqc-dot"><i></i><span id="tile-${i}-text"></span></span></div><div class="det" id="tile-${i}-det"></div></div>`).join('');
    el('tiles').dataset.built = '1';
  }
  tiles.forEach(([, ok, text, detail], i) => {
    const node = el(`tile-${i}`); if (node) node.className = 'qqc-dot ' + (ok ? 'ok' : 'bad');
    setText(`tile-${i}-text`, text); setText(`tile-${i}-det`, detail);
  });

  setHtml('system', tr('负载', (d.system.load || []).join(' / '))
    + tr('内存', d.system.memory ? `${d.system.memory.usedPercent}%（可用 ${bytes(d.system.memory.availableBytes)}）` : '?')
    + tr('磁盘', d.system.disk ? `${d.system.disk.usedPercent}%（可用 ${bytes(d.system.disk.freeBytes)}）` : '?')
    + tr('开机时长', dur(d.system.uptimeSeconds)));
  setText('versions', `node ${d.system.node} · dsh ${d.system.dsh} · 桥接 ${d.system.bridge} · napcat ${d.system.napcatImage}`);

  setHtml('ports', tr('DSH WebUI ' + p.dsh, dot(p.dshUsable ? 'ok' : (p.dshPortOpen ? 'warn' : 'bad'), p.dshUsable ? '可用' : (p.dshPortOpen ? '端口通但无响应' : '不可用'), `HTTP ${p.dshProbe.code || '-'} · ${p.dshProbe.ms}ms`))
    + tr('QQ 桥接 6700', dot(p.bridgeUsable ? 'ok' : (p.bridgePortOpen ? 'warn' : 'bad'), p.bridgeUsable ? '可用' : '不可用', p.bridgePortOpen ? '端口在听' : '端口未监听'))
    + tr('NapCat WebUI 6099', dot(p.napcatUsable ? 'ok' : (p.napcatWebuiPortOpen ? 'warn' : 'bad'), p.napcatUsable ? '可用' : '不可用', `HTTP ${p.napcatProbe.code || '-'}`)));

  setHtml('docker', (d.docker.containers || []).map((c) => tr(c.name, dot(c.running ? (c.healthy || !/healthy/.test(c.status) ? 'ok' : 'warn') : 'bad', c.running ? (c.healthy ? 'healthy' : '运行中') : '未运行', c.status))).join('') || '<tr><td class="qqc-empty">docker 不可用</td></tr>');

  const b = d.bridge;
  setHtml('bridge', b.available
    ? tr('宿主 PID', esc(b.pid)) + tr('版本 / 运行', `${esc(b.version)} · ${dur(b.uptimeSeconds)}`) + tr('会话数', b.sessionCount)
      + tr('待处理入群', b.joinsPending) + tr('提醒 / 投票 / 游戏', `${b.reminders} / ${b.votes} / ${b.games}`) + tr('能力门拒绝', b.gateDenied)
    : tr('状态文件', '<span class="qqc-sub">读不到 runtime.json</span>'));
  setText('traces', (b.recentTraces || []).map((t) => `${t.id}  ${t.chatKey || ''}  ${t.durationMs || 0}ms  [${(t.stages || []).join(' > ')}]`).join('\n') || '（暂无）');

  const px = d.proxy;
  setHtml('proxy', px.available
    ? tr('当前模式', px.mode === 'proxy' ? dot('ok', '走代理') : dot('warn', '直连')) + tr('最近探活', `${esc(px.code)} · ${px.healthy ? '可用' : '不可用'}`) + tr('代理地址', esc(px.proxy || '未配置')) + tr('探测时间', new Date(px.at).toLocaleString('zh-CN'))
    : tr('代理状态', '<span class="qqc-sub">读不到 proxy.json</span>'));
  setText('proxylog', (px.log || []).join('\n') || '（还没有 proxy check 记录）');

  setHtml('napcat', tr('容器', esc(d.napcat.container)) + tr('WebUI', dot(d.napcat.webuiUp ? 'ok' : 'bad', d.napcat.webuiUp ? '可达' : '不可达'))
    + tr('二维码缓存', d.napcat.qr.cached ? `${d.napcat.qr.ageSeconds}s 前（${bytes(d.napcat.qr.bytes)}）` : '未取过'));

  const svc = (id, name, state, pid, restarts, risk) => `<tr>
    <td><b>${esc(name)}</b><div class="qqc-sub">${esc(id)}</div></td>
    <td>${dot(['active','running'].includes(state) ? 'ok' : 'bad', state)}</td>
    <td class="num">${esc(pid || '-')}</td>
    <td class="num">${esc(restarts || '0')}</td>
    <td class="qqc-sub">${esc(risk)}</td>
    <td class="act"><button class="qqc-btn ghost sm" onclick="svcAction('${esc(id)}','restart')">重启</button>${id === 'dsh-web' ? ` <button class="qqc-btn danger sm" onclick="svcAction('${esc(id)}','stop')">停止</button>` : ''}</td>
  </tr>`;
  if (!d.services) { el('services').innerHTML = ''; }
}
let systemCache = null;
async function loadSystem() {
  const res = await fetch('/api/system');
  if (res.status === 401) { location.href = '/login?next=' + encodeURIComponent('/status'); return; }
  const d = await res.json();
  systemCache = d;
  el('envPath').textContent = d.envFile;
  setHtml('services', d.services.map((s) => `<tr>
      <td><b>${esc(s.name)}</b><div class="qqc-sub">${esc(s.id)}</div></td>
      <td>${dot(['active','running'].includes(s.state) ? 'ok' : 'bad', s.state)}</td>
      <td class="num">${esc(s.pid || '-')}</td>
      <td class="num">${esc(s.restarts || '0')}</td>
      <td class="qqc-sub">${esc(s.risk)}</td>
      <td class="act"><button class="qqc-btn ghost sm" onclick="svcAction('${esc(s.id)}','restart')">重启</button>${s.id === 'dsh-web' ? ` <button class="qqc-btn danger sm" onclick="svcAction('${esc(s.id)}','stop')">停止</button>` : ''}</td>
    </tr>`).join(''));
  // 参数表：用户改过或正在输入时不动它（否则 60 秒一次的重建会把输入清掉/页面跳走）
  const paramsDirty = [...el('params').querySelectorAll('[data-pkey]')].some((n) => n.dataset.dirty === '1' || n === document.activeElement);
  if (!paramsDirty) setHtml('params', d.params.map((p) => `<div class="qqc-field">
      <div><div class="lab">${esc(p.label)}</div><div class="hint">${esc(p.key)}${p.min !== null ? ` · ${p.min}~${p.max}` : ''}${p.missing ? ' · 当前用默认值' : ''}</div></div>
      <div><input class="qqc-in" data-pkey="${esc(p.key)}" value="${esc(p.value)}"></div>
    </div>`).join(''));
  setText('logWatchdog', (d.logs.watchdog || []).slice(-25).join('\n') || '（空）');
  setText('logRestart', (d.logs.restart || []).join('\n') || '（空）');
  setText('logIncidents', (d.logs.incidents || []).map((i) => `${new Date(i.at).toLocaleString('zh-CN')}  ${i.kind}  ${i.detail}`).join('\n') || '（无）');
}
async function ensureSudo() {
  const s = await fetch('/api/session').then((r) => r.json());
  if (s.sudo) return true;
  const pw = window.prompt('危险操作需要确认密码（5 分钟内有效）');
  if (!pw) return false;
  const d = await fetch('/api/reauth', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ password: pw }) }).then((r) => r.json());
  if (!d.ok) { el('svcMsg').className = 'qqc-msg err'; el('svcMsg').textContent = d.error || '密码不对'; return false; }
  return true;
}
async function svcAction(id, action) {
  if (!(await ensureSudo())) return;
  const d = await fetch('/api/system/service', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id, action }) }).then((r) => r.json());
  el('svcMsg').className = 'qqc-msg ' + (d.ok ? 'ok' : 'err');
  el('svcMsg').textContent = d.ok ? `${id} 已执行 ${action}` : `失败：${d.error}`;
  setTimeout(loadSystem, 1500);
}
async function saveSystem() {
  if (!(await ensureSudo())) return;
  const values = {};
  for (const node of el('params').querySelectorAll('[data-pkey]')) values[node.dataset.pkey] = node.value;
  const r = await fetch('/api/system/config', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ values }) }).then((x) => x.json());
  if (!r.ok) { el('sysMsg').className = 'qqc-msg err'; el('sysMsg').textContent = '失败：' + r.error; return; }
  const r2 = await fetch('/api/system/service', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: 'dsh-watchdog', action: 'restart' }) }).then((x) => x.json());
  el('sysMsg').className = 'qqc-msg ' + (r2.ok ? 'ok' : 'err');
  for (const n of el('params').querySelectorAll('[data-pkey]')) n.dataset.dirty = '0';
  el('sysMsg').textContent = `已写入 ${r.changed.join(', ')}${r.rejected?.length ? `（跳过 ${r.rejected.join(', ')}）` : ''}` + (r2.ok ? ' · 看门狗已重启，参数生效' : ` · 看门狗重启失败：${r2.error}`);
  setTimeout(loadSystem, 1500);
}
refresh();
loadQr();
loadSystem();
setInterval(refresh, 10000);
setInterval(loadSystem, 60000);
setInterval(loadQr, 60000);
</script>
</body>
</html>
