<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>插件管理</title>
<link rel="stylesheet" href="/console.css">
<style>
  /* 插件页沿用 console.css 的设计语言；这里只补它自己的少量结构样式 */
  .qqc-table td .actions { display:flex; gap:6px; justify-content:flex-end; }
  .qqc-table td .actions button { padding:4px 10px; font-size:12px; }
  .qqc-badge { display:inline-block; padding:1px 8px; border-radius:999px; font-size:12px; }
  .qqc-badge.on { background:rgba(49,196,141,.14); color:#4ddba6; border:1px solid rgba(49,196,141,.35); }
  .qqc-badge.off { background:rgba(120,133,154,.14); color:#9aa7b8; border:1px solid rgba(120,133,154,.35); }
  .qqc-badge.bad { background:rgba(240,97,109,.14); color:#f8868f; border:1px solid rgba(240,97,109,.35); }
  .qqc-badge.kind { background:rgba(76,141,255,.12); color:#8fb6ff; border:1px solid rgba(76,141,255,.3); }
  .qqc-sheet .field { margin-bottom:14px; }
  .qqc-sheet .field label { display:block; font-size:12px; color:var(--muted); margin-bottom:5px; }
  .qqc-sheet .field .hint { font-size:11px; color:var(--muted); margin-top:4px; }
  .qqc-sheet .field input, .qqc-sheet .field select { width:100%; background:var(--bg); color:var(--fg); border:1px solid var(--line2); border-radius:8px; padding:8px 10px; font-size:13px; font-family:var(--mono); }
  .qqc-switch { display:flex; align-items:center; gap:8px; }
  .qqc-pre { background:#090c11; border:1px solid var(--line); border-radius:8px; padding:10px 12px; overflow:auto; max-height:200px; font:12px/1.6 var(--mono); color:#c7d2e0; white-space:pre-wrap; }
  details summary { cursor:pointer; color:var(--fg2); font-size:13px; }
</style>
</head>
<body class="qqc">
<div class="qqc-top"><div class="qqc-top-in">
  <span class="qqc-title">插件管理</span>
  <span class="qqc-sub" id="rootInfo"></span>
  <nav>
    <a id="navStatus" href="/status">状态台</a>
    <a href="/identity">身份</a>
    <a href="/system">系统配置</a>
    <a id="navAcl" href="/">权限与语料</a>
    <a href="#" onclick="doLogout();return false">退出</a>
  </nav>
</div></div>
<div class="qqc-wrap">
  <div class="bar">
    <button onclick="openInstall()" class="qqc-btn">安装插件</button>
    <button class="ghost" onclick="load()" class="qqc-btn ghost">刷新</button>
    <span class="grow"></span>
    <span class="qqc-sub" id="summary"></span>
  </div>
  <section class="qqc-card" style="padding:0;overflow:hidden"><table class="qqc-table">
    <thead><tr><th>插件</th><th>来源</th><th>版本</th><th>状态</th><th>配置字段</th><th style="text-align:right">操作</th></tr></thead>
    <tbody id="rows"></tbody>
  </table></section>
  <p class="qqc-sub" style="margin-top:14px">说明：改动写入 ~/.dsh/cordis.patch.yml（自动备份）。启用/禁用/配置/装卸都需要重启宿主（或 profile 热重载）后生效。密钥字段留空表示"不修改"。</p>
</div>

<div class="qqc-modal" id="mdConfig"><div class="qqc-sheet">
  <header><h3 id="cfgTitle">配置</h3></header>
  <div class="body">
    <div id="cfgFields"></div>
    <details><summary class="qqc-sub">查看脱敏后的原始配置</summary><div class="qqc-pre" id="cfgRaw"></div></details>
  </div>
  <div class="foot"><button class="ghost" onclick="closeModal('mdConfig')">取消</button><button onclick="saveConfig()" class="qqc-btn">保存</button></div>
</div></div>

<div class="qqc-modal" id="mdInstall"><div class="qqc-sheet">
  <header><h1>安装插件</h3></header>
  <div class="body">
    <div class="field">
      <label>本地插件目录（需含 package.json 与入口）</label>
      <select id="candSelect" style="width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 9px"></select>
      <div class="hint">列表来自配置的插件源码目录（QQ_PLUGIN_SOURCES）；已安装的会标注。也可以直接输入绝对路径：</div>
      <input type="text" id="candPath" placeholder="插件目录绝对路径" style="margin-top:6px">
    </div>
    <div id="installMsg" class="qqc-sub"></div>
  </div>
  <div class="foot"><button class="ghost" onclick="closeModal('mdInstall')">取消</button><button onclick="doInstall()" class="qqc-btn">安装</button></div>
</div></div>

<div class="qqc-modal" id="mdConfirm"><div class="qqc-sheet" style="width:min(520px,92vw)">
  <header><h3 id="confirmTitle">确认</h3></header>
  <div class="body"><div id="confirmBody"></div></div>
  <div class="foot"><button class="ghost" onclick="closeModal('mdConfirm')">取消</button><button class="danger" id="confirmOk">确认</button></div>
</div></div>

<script>
const q = () => '';
const el = (id) => document.getElementById(id);
const esc = (v) => String(v ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
navStatus.href = '/status'; navAcl.href = '/';
async function doLogout() { await fetch('/api/logout', { method: 'POST' }); location.href = '/login'; }
let current = null;

async function api(path, body) {
  const res = await fetch(path, body === undefined ? undefined : { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  if (res.status === 401) { location.href = '/login?next=' + encodeURIComponent('/plugins'); return { ok: false, error: '未登录' }; }
  return res.json();
}
function closeModal(id) { el(id).classList.remove('open'); }
function openModal(id) { el(id).classList.add('open'); }
function confirmSheet(title, html, onOk) {
  el('confirmTitle').textContent = title; el('confirmBody').innerHTML = html;
  const btn = el('confirmOk'); btn.onclick = async () => { await onOk(); closeModal('mdConfirm'); };
  openModal('mdConfirm');
}

async function load() {
  const d = await api('/api/plugins');
  el('rootInfo').textContent = d.roots.pluginSources;
  el('summary').textContent = `${d.plugins.filter(p => p.kind === 'local').length} 个本地插件 · ${d.plugins.filter(p => p.kind === 'bundle').length} 个内置/依赖`;
  el('rows').innerHTML = d.plugins.map((p) => `
    <tr>
      <td><b>${esc(p.id)}</b><div class="qqc-sub">${esc(p.name)}</div></td>
      <td><div>${esc(p.kind === 'bundle' ? '内置/依赖' : '本地插件')}</div><div class="qqc-sub">${esc(p.source)}</div></td>
      <td>${esc(p.version || '-')}</td>
      <td>${p.broken ? '<span class="qqc-badge bad">断链</span>' : (p.enabled ? '<span class="qqc-badge on">启用</span>' : '<span class="qqc-badge off">禁用</span>')}${p.optional && !p.configured ? ' <span class="qqc-badge off" title="配置留空时该插件的工具不注册">未配置</span>' : ''}</td>
      <td>${p.fieldCount || '<span class="qqc-sub">—</span>'}</td>
      <td><div class="actions">
        ${p.kind === 'local' ? `<button class="ghost" onclick="openConfig('${esc(p.id)}')" class="qqc-btn ghost">配置</button>
        <button class="qqc-btn ghost" onclick="toggle('${esc(p.id)}', ${!p.enabled})">${p.enabled ? '禁用' : '启用'}</button>
        <button class="qqc-btn danger" onclick="uninstall('${esc(p.id)}')">卸载</button>` : '<span class="qqc-sub">由 profile 管理</span>'}
      </div></td>
    </tr>`).join('');
}

async function openConfig(id) {
  const d = await api('/api/plugins/detail?id=' + encodeURIComponent(id));
  if (!d.ok) return alert(d.error);
  current = { id, fields: d.fields };
  el('cfgTitle').textContent = `配置 · ${id}`;
  const hintBox = d.optional && !d.configured
    ? `<div class="hint" style="margin-bottom:10px">未配置：${esc((d.missingKeys || []).join(' / '))} 为空。<br>${esc(d.configHint || '')}</div>`
    : '';
  el('cfgFields').innerHTML = hintBox + (d.fields.map((f) => {
    const hint = [f.desc, f.secret && f.hasValue ? '已设置（留空＝不修改）' : ''].filter(Boolean).join(' · ');
    let input = `<input type="${f.type === 'number' ? 'number' : (f.secret ? 'password' : 'text')}" data-key="${esc(f.key)}" value="${esc(f.value)}" placeholder="${f.secret && f.hasValue ? '已设置，留空不改' : ''}">`;
    if (f.type === 'bool') input = `<div class="switch"><input type="checkbox" data-key="${esc(f.key)}" ${String(f.value) === 'true' ? 'checked' : ''}> <span class="qqc-sub">开 / 关</span></div>`;
    if (f.type === 'select') input = `<select data-key="${esc(f.key)}">${(f.options || []).map((o) => `<option ${String(f.value) === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
    return `<div class="field"><label>${esc(f.label)} <span class="qqc-sub">(${esc(f.key)})</span></label>${input}${hint ? `<div class="hint">${esc(hint)}</div>` : ''}</div>`;
  }).join('') || '<p class="qqc-sub">这个插件没有可配置字段。</p>');
  // sshKey 的指纹 / 连通性快捷操作
  const keyField = d.fields.find((f) => f.key === 'sshKey');
  if (keyField) {
    el('cfgFields').insertAdjacentHTML('beforeend', `
      <div class="field"><label>SSH Key 工具</label>
        <button class="ghost" onclick="fp()" class="qqc-btn ghost sm">查指纹</button>
        <button class="ghost" onclick="ssh()" class="qqc-btn ghost sm">测试连接</button>
        <div class="qqc-pre" id="keyOut"></div>
      </div>`);
  }
  el('cfgRaw').textContent = d.redacted;
  openModal('mdConfig');
}

function collectValues() {
  const values = {};
  for (const node of el('cfgFields').querySelectorAll('[data-key]')) {
    if (node.type === 'checkbox') values[node.dataset.key] = node.checked;
    else values[node.dataset.key] = node.value;
  }
  return values;
}
async function saveConfig() {
  const r = await api('/api/plugins/config', { id: current.id, values: collectValues() });
  if (!r.ok) return alert('保存失败：' + r.error);
  alert(`已保存：${r.changed.join(', ')}${r.skipped.length ? `\n跳过：${r.skipped.join(', ')}` : ''}\n备份：${r.backup}\n${r.note}`);
  closeModal('mdConfig'); load();
}
async function fp() {
  const key = el('cfgFields').querySelector('[data-key=sshKey]').value;
  const r = await api('/api/plugins/key-fingerprint?path=' + encodeURIComponent(key));
  el('keyOut').textContent = r.ok ? r.fingerprint : '失败：' + r.error;
}
async function ssh() {
  const v = collectValues();
  el('keyOut').textContent = '测试中…';
  const r = await api('/api/plugins/ssh-test', { host: String(v.ecsHost || '').trim(), user: String(v.ecsUser || '').trim(), port: Number(v.ecsPort || 22), keyPath: String(v.sshKey || '').trim() });
  el('keyOut').textContent = (r.ok ? '连通成功：\n' : '失败：\n') + (r.output || '');
}
async function toggle(id, enabled) {
  const r = await api('/api/plugins/toggle', { id, enabled });
  if (!r.ok) return alert('操作失败：' + r.error);
  alert(`${enabled ? '已启用' : '已禁用'} ${id}\n${r.note}`); load();
}
async function uninstall(id) {
  confirmSheet('卸载插件', `<p>要从配置里移除 <b>${esc(id)}</b> 吗？</p><p class="qqc-sub">会同时删掉 ~/.dsh/plugins 下的软链；源目录不会删。</p>`, async () => {
    const r = await api('/api/plugins/uninstall', { id, removeLink: true });
    alert(r.ok ? `已卸载 ${id}（备份：${r.backup}）\n${r.note}` : '失败：' + r.error); load();
  });
}
async function openInstall() {
  const d = await api('/api/plugins');
  el('candSelect').innerHTML = '<option value="">（从下面列表选一个）</option>' + d.candidates.map((c) => `<option value="${esc(c.source)}" ${c.installed ? 'disabled' : ''}>${esc(c.name)}${c.installed ? '（已装）' : ''} v${esc(c.version || '-')}</option>`).join('');
  el('installMsg').textContent = '';
  openModal('mdInstall');
}
async function doInstall() {
  const source = el('candPath').value.trim() || el('candSelect').value;
  if (!source) return alert('选一个目录或填绝对路径');
  el('installMsg').textContent = '安装中…';
  const r = await api('/api/plugins/install', { source });
  el('installMsg').innerHTML = r.ok ? `<span class="ok">已安装 ${esc(r.id)}</span><div class="qqc-sub">${esc(r.note)}</div><pre>${esc(r.link)}</pre>` : `<span class="err">失败：${esc(r.error)}</span>`;
  if (r.ok) load();
}
load();
</script>
</body>
</html>
